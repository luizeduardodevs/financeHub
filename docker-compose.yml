services:

  mysql:
     image: mysql:8.0
     container_name: financehub-mysql

     environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: financehub
        MYSQL_USER: financehub
        MYSQL_PASSWORD: financehub

     ports:
        - "3306:3306"
     healthcheck:
       test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-proot"]
       interval: 5s
       timeout: 5s
       retries: 10
  app: 
    build: .
    container_name: financehub-app

    depends_on:
      mysql:
        condition: service_healthy   
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true